name: Probe Costco published product sitemaps
on:
  push:
    branches: [feature/costco-official-product-sitemaps]
    paths:
      - scripts/probe_costco_products.py
      - .github/workflows/probe-costco-products.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public Costco product URL sitemap
        run: python3 scripts/probe_costco_products.py
