name: Discover Independent and FreshCo link candidates
on:
  push:
    branches: [feature/freshco-independent-url-import, feature/grocery-catalogue-expansion-2026-11]
    paths:
      - scripts/discover_remaining_urls.py
      - data/freshco-indexed-product-pages.json
      - .github/workflows/discover-remaining-retailer-urls.yml
  workflow_dispatch:
concurrency:
  group: discover-remaining-retailer-urls
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match existing SKU candidates and search-indexed direct URLs
        run: python3 scripts/discover_remaining_urls.py .
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-retailer-product-links
          path: |
            data/independent-url-matches.json
            data/independent-parts/
            data/freshco-url-matches.json
            data/freshco-parts/
      - name: Save vetted URL-only batches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/independent-url-matches.json data/independent-parts/ data/freshco-url-matches.json data/freshco-parts/
          if ! git diff --staged --quiet; then
            git commit -m "Create Independent shared-SKU and FreshCo indexed URL candidates (no prices)"
            for attempt in 1 2 3 4 5; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
