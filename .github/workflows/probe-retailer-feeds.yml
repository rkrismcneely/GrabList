name: Probe public retailer catalogue feeds
on:
  push:
    branches: [feature/more-retailer-catalogue-links]
    paths:
      - scripts/probe_retailer_feeds.py
      - .github/workflows/probe-retailer-feeds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public feeds without crawling or bypassing protections
        run: python3 scripts/probe_retailer_feeds.py
